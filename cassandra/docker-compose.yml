services:
  cassandra01:
    image: "cassandra:latest"
    container_name: "cassandra01"
    ports:
      - 127.0.0.1:7000:7000
      - 127.0.0.1:9042:9042
      - 127.0.0.1:7199:7199
    networks:
      net:
        ipv4_address: 172.30.0.2
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=1024M
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_LISTEN_ADDRESS=cassandra01
      - CASSANDRA_CLUSTER_NAME=cassandra-cluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=datacenter01
      - CASSANDRA_SEEDS=cassandra01,cassandra02,cassandra03
    volumes:
      - vol01:/var/lib/cassandra:rw
      - ./cassandra01.yaml:/etc/cassandra/cassandra.yaml
      - ./cassandra01:/root/.cassandra
      - ./createDB.cql:/root/createDB.cql
    restart:
      on-failure
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 2m
      start_period: 2m
      timeout: 10s
      retries: 3

  cassandra02:
    image: "cassandra:latest"
    container_name: "cassandra02"
    ports:
      - 127.0.0.1:9043:9042
    networks:
      net:
        ipv4_address: 172.30.0.3
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=1024M
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_LISTEN_ADDRESS=cassandra02
      - CASSANDRA_CLUSTER_NAME=cassandra-cluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=datacenter01
      - CASSANDRA_SEEDS=cassandra01,cassandra02,cassandra03
    depends_on:
      cassandra01:
        condition: service_healthy
    volumes:
      - vol02:/var/lib/cassandra:rw
      - ./cassandra02.yaml:/etc/cassandra/cassandra.yaml
      - ./cassandra02:/root/.cassandra
    restart:
      on-failure
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 2m
      start_period: 2m
      timeout: 10s
      retries: 3

  cassandra03:
    image: "cassandra:latest"
    container_name: "cassandra03"
    ports:
      - 127.0.0.1:9044:9042
    networks:
      net:
        ipv4_address: 172.30.0.4
    environment:
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=1024M
      - CASSANDRA_START_RPC=true
      - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - CASSANDRA_LISTEN_ADDRESS=cassandra03
      - CASSANDRA_CLUSTER_NAME=cassandra-cluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=datacenter01
      - CASSANDRA_SEEDS=cassandra01,cassandra02,cassandra03
    depends_on:
      cassandra01:
        condition: service_healthy
    volumes:
      - vol03:/var/lib/cassandra:rw
      - ./cassandra03.yaml:/etc/cassandra/cassandra.yaml
      - ./cassandra03:/root/.cassandra
    restart:
      on-failure
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 2m
      start_period: 2m
      timeout: 10s
      retries: 3

volumes:
  vol01:
  vol02:
  vol03:

networks:
  net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1