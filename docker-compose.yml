services:
  monitordatamanager01:
    image: monitordatamanager:latest
    ports:
      - 127.0.0.1:6006:6006
      - 127.0.0.1:10051:10051
    container_name: monitordatamanager01
    networks:
      cassandra_net:
        ipv4_address: 172.30.0.10
    restart: always
    environment:
    - MONITOR_DM_ID=4a6b7085-2686-4c17-9ecc-c5145ac1082e

    - MONITOR_TLS_CERTPATH=server.crt
    - MONITOR_TLS_KEYPATH=server.key
    - MONITOR_TLS_KEYPASSWORD=
    - MONITOR_TLS_CAPATH=rootCA.crt

    - MONITOR_HTTP_HOST=0.0.0.0
    - MONITOR_HTTP_PORT=6006
    - MONITOR_HTTP_READTIMEOUT=10
    - MONITOR_HTTP_WRITETIMEOUT=10
    - MONITOR_HTTP_RL=100
    - MONITOR_HTTP_TLS=false
    - MONITOR_HTTP_TLS_SKIPVERIFY=true

    - MONITOR_DB_HOST=172.30.0.2:9042,172.30.0.3:9043
    - MONITOR_DB_USERNAME=
    - MONITOR_DB_PASSWORD=
    - MONITOR_DB_TLS=false
    - MONITOR_DB_TTLS_SKIPVERIFY=true
    - MONITOR_DB_KEYSPACE=monitor
    - MONITOR_DB_CONSISTENCY=Quorum
    - MONITOR_DB_CONSISTENCYREAD=One
    - MONITOR_DB_TIMEOUT=10000
    - MONITOR_BATCHSIZE=300

    - MONITOR_ZBX_HOST=0.0.0.0
    - MONITOR_ZBX_PORT=10051
    - MONITOR_ZBX_TYPE=tcp
    - MONITOR_ZBX_PASSIVEPORT=10050
    - MONITOR_ZBX_PASSIVETYPE=tcp
    - MONITOR_ZBX_TLS=false
    - MONITOR_ZBX_TLS_SKIPVERIFY=true
    - MONITOR_ZBX_WORKER_POOL=3
    - MONITOR_ZBX_WORKER_ACTIME=60

    - MONITOR_PRMTEXPORTER_ENABLED=true
    - MONITOR_PRMTEXPORTER_METRICS_PATH=/metrics

    - MONITOR_PRMTSCRAPER_ENABLED=true
    - MONITOR_PRMTSCRAPER_INTERVAL=60
    - MONITOR_PRMTSCRAPER_TIMEOUT=10
    - MONITOR_PRMTSCRAPER_RETRYATTEMPTS=3
    - MONITOR_PRMTSCRAPER_RETRYDELAY=2
    - MONITOR_PRMTSCRAPER_MAXCONNECTIONS=10
    - MONITOR_PRMTSCRAPER_WORKERSPOOL=3
    - MONITOR_PRMTSCRAPER_TLS=false
    - MONITOR_PRMTSCRAPER_TLS_SKIPVERIFY=true

    - MONITOR_SWG_TITLE=Swagger Polyxena DataManager API
    - MONITOR_SWG_DESCRIPTION=Monitoring system Polyxena DataManager
    - MONITOR_SWG_VERSION=1.0
    - MONITOR_SWG_HOST=localhost:6443
    - MONITOR_SWG_BASEPATH=/api/v1
    - MONITOR_SWG_SCHEME=https

    - MONITOR_SMTP_ENABLED=false
    - MONITOR_SMTP_HOST=
    - MONITOR_SMTP_PORT=587
    - MONITOR_SMTP_USERNAME=
    - MONITOR_SMTP_PASSWORD=
    - MONITOR_SMTP_KEEPALIVE=false
    - MONITOR_SMTP_TIMEOUTCONNECT=10
    - MONITOR_SMTP_TIMEOUTSEND=10
    - MONITOR_SMTP_TLS=true
    - MONITOR_SMTP_TLS_SKIPVERIFY=true
    - MONITOR_SMTP_AUTH=auto
    - MONITOR_SMTP_FROM=Monitoring
    - MONITOR_SMTP_QUEUE=1000

  monitordatamanager02:
    image: monitordatamanager:latest
    ports:
      - 127.0.0.1:6007:6006
      - 127.0.0.1:10052:10051
