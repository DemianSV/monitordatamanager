services:
  chrdsdatamanager01:
    image: chrdsdatamanager:latest
    ports:
      - 127.0.0.1:6006:6006
      - 10.30.0.1:6006:6006
      - 127.0.0.1:10051:10051
      - 10.30.0.1:10051:10051
    container_name: chrdsdatamanager01
    networks:
      cassandra_net:
        ipv4_address: 172.30.0.10
    restart: always
    environment:
    - CHRDS_HTTP_HOST=0.0.0.0
    - CHRDS_HTTP_PORT=6006
    - CHRDS_HTTP_READTIMEOUT=10
    - CHRDS_HTTP_WRITETIMEOUT=10
    - CHRDS_HTTP_RL=100
    - CHRDS_HTTP_TLS=false
    - CHRDS_HTTP_CERTPATH=
    - CHRDS_HTTP_KEYPATH=
    - CHRDS_HTTP_CAPATH=ca.pem
    - CHRDS_WORKER_NUM=10
    - CHRDS_WORKER_ACTIME=60
    - CHRDS_DB_HOST=172.30.0.2:9042,172.30.0.3:9043
    - CHRDS_DB_USERNAME=chrds
    - CHRDS_DB_PASSWORD=chrds
    - CHRDS_DB_TLS=true
    - CHRDS_DB_CERTPATH=
    - CHRDS_DB_KEYPATH=
    - CHRDS_DB_CAPATH=rootCA.crt
    - CHRDS_DB_HOSTVERIFICATION=false
    - CHRDS_DB_KEYSPACE=chrds
    - CHRDS_DB_CONSISTENCY=Quorum
    - CHRDS_DB_CONSISTENCYREAD=One
    - CHRDS_DB_TIMEOUT=10000
    - CHRDS_ZBX_HOST=0.0.0.0
    - CHRDS_ZBX_PORT=10051
    - CHRDS_ZBX_TYPE=tcp
    - CHRDS_ZBX_PASSIVEPORT=10050
    - CHRDS_ZBX_PASSIVETYPE=tcp
    - CHRDS_SWG_TITLE=Swagger Charibdis DataManager API
    - CHRDS_SWG_DESCRIPTION=Monitoring system Charibdis DataManager
    - CHRDS_SWG_VERSION=1.0
    - CHRDS_SWG_HOST=host.com:6443
    - CHRDS_SWG_BASEPATH=/api/v1
    - CHRDS_SWG_SCHEME=https
    - CHRDS_SMTP_ENABLED=false
    - CHRDS_SMTP_HOST=
    - CHRDS_SMTP_PORT=587
    - CHRDS_SMTP_USERNAME=
    - CHRDS_SMTP_PASSWORD=
    - CHRDS_SMTP_KEEPALIVE=false
    - CHRDS_SMTP_TIMEOUTCONNECT=10
    - CHRDS_SMTP_TIMEOUTSEND=10
    - CHRDS_SMTP_TLS=true
    - CHRDS_SMTP_HOSTVERIFICATION=false
    - CHRDS_SMTP_FROM=Monitoring <name@domain.com>
    - CHRDS_SMTP_QUEUE=1000

  chrdsdatamanager02:
