    - MONITOR_HTTP_TLS=false
    - MONITOR_HTTP_TLS_SKIPVERIFY=true

    - MONITOR_DB_HOST=172.30.0.2:9042,172.30.0.3:9043
    - MONITOR_DB_USERNAME=
    - MONITOR_DB_PASSWORD=
    - MONITOR_DB_TLS=false
    - MONITOR_DB_TLS_SKIPVERIFY=true
    - MONITOR_DB_KEYSPACE=monitor
    - MONITOR_DB_CONSISTENCY=Quorum
